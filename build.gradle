plugins {
    id 'com.android.application'
}

android {
    namespace 'br.felipaoos.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'br.felipaoos.launcher'
        minSdk 21
        targetSdk 28
        versionCode 1
        versionName '0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
